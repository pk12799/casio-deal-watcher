name: Casio deal check

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes - GitHub's free minimum is 5, 15 is kinder to the site
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab too

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 watch_alert.py --once

      - name: Save seen-deals state
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add seen_deals.json
          git diff --staged --quiet || git commit -m "update seen deals"
          git push
